services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17
    container_name: thc-marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: MarketplaceDb

    volumes:
      - thc-marketplace-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d MarketplaceDb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "127.0.0.1:5432:5432"

    networks:
      - thc-marketplace-network


  # ============================================================
  # Marketplace API
  # ============================================================
  marketplace-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-marketplace-api:latest
    container_name: thc-marketplace-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__MarketplaceDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=MarketplaceDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      CLOUDINARY_URL: >-
        cloudinary://${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@${CLOUDINARY_CLOUD_NAME}

      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - thc-marketplace-network


  # ============================================================
  # Collector Vault API
  # ============================================================
  collector-vault-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-collector-vault-api:latest
    container_name: thc-collector-vault-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__CollectorVaultDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=CollectorVaultDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started

    networks:
      - thc-marketplace-network


  # ============================================================
  # Buyer Wishlist API
  # ============================================================
  buyer-wishlist-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-buyer-wishlist-api:latest
    container_name: thc-buyer-wishlist-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__BuyerWishlistDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=BuyerWishlistDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started

    networks:
      - thc-marketplace-network


  # ============================================================
  # Seller Hub API
  # ============================================================
  seller-hub-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-seller-hub-api:latest
    container_name: thc-seller-hub-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__SellerHubDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=SellerHubDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - thc-marketplace-network


  # ============================================================
  # Customer Orders API
  # ============================================================
  customer-orders-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-customer-orders-api:latest
    container_name: thc-customer-orders-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__CustomerOrdersDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=CustomerOrdersDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080
      Services__SellerHubUrl: http://seller-hub-api:8080

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started
      seller-hub-api:
        condition: service_started

    networks:
      - thc-marketplace-network


  # ============================================================
  # User Management API
  # ============================================================
  user-management-api:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-user-management-api:latest
    container_name: thc-user-management-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__UserAccountDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=UserAccountDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - thc-marketplace-network


  # ============================================================
  # Email Service API
  # ============================================================
  email-service-api:
    image: ghcr.io/${GHCR_OWNER:-waseem15280}/${GHCR_IMAGE_PREFIX:-mywatchmarketplace}-email-service-api:latest
    container_name: thc-email-service-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__UserAccountDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=UserAccountDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      EmailSettings__SmtpHost: ${SMTP_HOST:-smtp.gmail.com}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__SenderName: ${SMTP_SENDER_NAME:-THC Watch Marketplace}
      EmailSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-no-reply@thcwatches.com}
      EmailSettings__Username: ${SMTP_USERNAME:-}
      EmailSettings__Password: ${SMTP_PASSWORD:-}
      EmailSettings__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      EmailSettings__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://155.248.245.193}
      EmailSettings__TokenExpirationMinutes: ${TOKEN_EXPIRATION_MINUTES:-60}
      EmailSettings__UseMockInDevelopment: ${EMAIL_USE_MOCK:-false}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - thc-marketplace-network


  # ============================================================
  # YARP API Gateway
  # ============================================================
  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-waseem15280}/${GHCR_IMAGE_PREFIX:-mywatchmarketplace}-api-gateway:latest
    container_name: thc-api-gateway
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ReverseProxy__Clusters__marketplace-cluster__Destinations__marketplace-destination__Address: http://marketplace-api:8080

      ReverseProxy__Clusters__collector-vault-cluster__Destinations__collector-vault-destination__Address: http://collector-vault-api:8080

      ReverseProxy__Clusters__buyer-wishlist-cluster__Destinations__buyer-wishlist-destination__Address: http://buyer-wishlist-api:8080

      ReverseProxy__Clusters__seller-hub-cluster__Destinations__seller-hub-destination__Address: http://seller-hub-api:8080

      ReverseProxy__Clusters__customer-orders-cluster__Destinations__customer-orders-destination__Address: http://customer-orders-api:8080

      ReverseProxy__Clusters__user-management-cluster__Destinations__user-management-destination__Address: http://user-management-api:8080

      ReverseProxy__Clusters__email-service-cluster__Destinations__email-service-destination__Address: http://email-service-api:8080


    depends_on:
      marketplace-api:
        condition: service_started
      collector-vault-api:
        condition: service_started
      buyer-wishlist-api:
        condition: service_started
      seller-hub-api:
        condition: service_started
      customer-orders-api:
        condition: service_started
      user-management-api:
        condition: service_started
      email-service-api:
        condition: service_started

    networks:
      - thc-marketplace-network


  # ============================================================
  # React Frontend
  # ============================================================
  frontend:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_IMAGE_PREFIX}-frontend:latest
    container_name: thc-marketplace-frontend
    restart: unless-stopped

    depends_on:
      api-gateway:
        condition: service_started

    networks:
      - thc-marketplace-network


  # ======================================================
  # Nginx
  # ======================================================
  nginx:
    image: nginx:alpine
    container_name: thc-marketplace-nginx
    restart: unless-stopped

    ports:
       - "80:80"

    volumes:
       - /opt/thc-marketplace/nginx/conf.d/marketplace.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
       - frontend
       - api-gateway

    networks:
       - thc-marketplace-network

volumes:
  thc-marketplace-postgres-data:


networks:
  thc-marketplace-network:
    driver: bridge
