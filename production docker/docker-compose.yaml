services:

  # =========================================================================
  # 1. PostgreSQL 17
  # =========================================================================
  postgres:
    image: postgres:17
    container_name: thc-marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}

    volumes:
      - thc-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend

    # IMPORTANT:
    # No "ports" section.
    # PostgreSQL is accessible only inside Docker.
    expose:
      - "5432"


  # =========================================================================
  # 2. Marketplace API
  # =========================================================================
  marketplace-api:
    image: ${REGISTRY}/marketplace-api:${IMAGE_TAG}
    container_name: thc-marketplace-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__MarketplaceDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=MarketplaceDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      Cloudinary__Url: ${CLOUDINARY_URL}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  # =========================================================================
  # 3. Collector Vault API
  # =========================================================================
  collector-vault-api:
    image: ${REGISTRY}/collector-vault-api:${IMAGE_TAG}
    container_name: thc-collector-vault-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__CollectorVaultDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=CollectorVaultDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started

    networks:
      - backend


  # =========================================================================
  # 4. Buyer Wishlist API
  # =========================================================================
  buyer-wishlist-api:
    image: ${REGISTRY}/buyer-wishlist-api:${IMAGE_TAG}
    container_name: thc-buyer-wishlist-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__BuyerWishlistDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=BuyerWishlistDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started

    networks:
      - backend


  # =========================================================================
  # 5. Seller Hub API
  # =========================================================================
  seller-hub-api:
    image: ${REGISTRY}/seller-hub-api:${IMAGE_TAG}
    container_name: thc-seller-hub-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__SellerHubDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=SellerHubDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend


  # =========================================================================
  # 6. Customer Orders API
  # =========================================================================
  customer-orders-api:
    image: ${REGISTRY}/customer-orders-api:${IMAGE_TAG}
    container_name: thc-customer-orders-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__CustomerOrdersDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=CustomerOrdersDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Services__MarketplaceUrl: http://marketplace-api:8080
      Services__SellerHubUrl: http://seller-hub-api:8080

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started
      seller-hub-api:
        condition: service_started

    networks:
      - backend


  # =========================================================================
  # 7. User Management API
  # =========================================================================
  user-management-api:
    image: ${REGISTRY}/user-management-api:${IMAGE_TAG}
    container_name: thc-user-management-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__UserAccountDbConnection: >-
        Host=postgres;
        Port=5432;
        Database=UserAccountDb;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend


  # =========================================================================
  # 8. YARP API Gateway
  # =========================================================================
  api-gateway:
    image: ${REGISTRY}/api-gateway:${IMAGE_TAG}
    container_name: thc-api-gateway
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ReverseProxy__Clusters__marketplace-cluster__Destinations__marketplace-destination__Address: http://marketplace-api:8080

      ReverseProxy__Clusters__collector-vault-cluster__Destinations__collector-vault-destination__Address: http://collector-vault-api:8080

      ReverseProxy__Clusters__buyer-wishlist-cluster__Destinations__buyer-wishlist-destination__Address: http://buyer-wishlist-api:8080

      ReverseProxy__Clusters__seller-hub-cluster__Destinations__seller-hub-destination__Address: http://seller-hub-api:8080

      ReverseProxy__Clusters__customer-orders-cluster__Destinations__customer-orders-destination__Address: http://customer-orders-api:8080

      ReverseProxy__Clusters__user-management-cluster__Destinations__user-management-destination__Address: http://user-management-api:8080

    expose:
      - "8080"

    depends_on:
      marketplace-api:
        condition: service_started
      collector-vault-api:
        condition: service_started
      buyer-wishlist-api:
        condition: service_started
      seller-hub-api:
        condition: service_started
      customer-orders-api:
        condition: service_started
      user-management-api:
        condition: service_started

    networks:
      - backend
      - frontend


  # =========================================================================
  # 9. React Frontend
  # =========================================================================
  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG}
    container_name: thc-marketplace-frontend
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      api-gateway:
        condition: service_started

    networks:
      - frontend

    # ONLY public application ports.
    ports:
      - "80:80"


# ===========================================================================
# Volumes
# ===========================================================================
volumes:

  thc-postgres-data:
    name: thc-marketplace-postgres-data


# ===========================================================================
# Networks
# ===========================================================================
networks:

  backend:
    name: thc-marketplace-backend
    driver: bridge

  frontend:
    name: thc-marketplace-frontend
    driver: bridge