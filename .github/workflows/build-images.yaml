name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:

        include:

          # ---------------------------------------------------------------
          # Marketplace
          # ---------------------------------------------------------------
          - name: marketplace-api
            context: ./backend
            dockerfile: ./backend/services/marketplace/Dockerfile

          # ---------------------------------------------------------------
          # Collector Vault
          # ---------------------------------------------------------------
          - name: collector-vault-api
            context: ./backend
            dockerfile: ./backend/services/CollectorVault/Dockerfile

          # ---------------------------------------------------------------
          # Buyer Wishlist
          # ---------------------------------------------------------------
          - name: buyer-wishlist-api
            context: ./backend
            dockerfile: ./backend/services/BuyerWishlist/Dockerfile

          # ---------------------------------------------------------------
          # Seller Hub
          # ---------------------------------------------------------------
          - name: seller-hub-api
            context: ./backend
            dockerfile: ./backend/services/SellerHub/Dockerfile

          # ---------------------------------------------------------------
          # Customer Orders
          # ---------------------------------------------------------------
          - name: customer-orders-api
            context: ./backend
            dockerfile: ./backend/services/CustomerOrders/Dockerfile

          # ---------------------------------------------------------------
          # User Management
          # ---------------------------------------------------------------
          - name: user-management-api
            context: ./backend
            dockerfile: ./backend/services/UserManagement/Dockerfile

          # ---------------------------------------------------------------
          # YARP API Gateway
          # ---------------------------------------------------------------
          - name: api-gateway
            context: ./backend
            dockerfile: ./backend/gateway/MyWatchMarketplace.ApiGateway/Dockerfile

          # ---------------------------------------------------------------
          # React Frontend
          # ---------------------------------------------------------------
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile


    steps:

      # ================================================================
      # 1. Checkout repository
      # ================================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ================================================================
      # 2. Setup QEMU
      #
      # Allows GitHub's x86 runner to build ARM64 images.
      # ================================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64


      # ================================================================
      # 3. Setup Docker Buildx
      # ================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ================================================================
      # 4. Login to GHCR
      # ================================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ================================================================
      # 5. Convert repository name to lowercase
      #
      # GHCR image names must be lowercase.
      # ================================================================
      - name: Get lowercase image owner
        id: image
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"


      # ================================================================
      # 6. Build and push ARM64 image
      # ================================================================
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}

          platforms: linux/arm64

          push: true

          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/mywatchmarketplace-${{ matrix.name }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/mywatchmarketplace-${{ matrix.name }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

          # Only needed by the frontend.
          build-args: |
            VITE_API_GATEWAY_URL=${{ vars.VITE_API_GATEWAY_URL }}