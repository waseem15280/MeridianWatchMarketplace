services:
  postgres:
    image: postgres:17
    container_name: MyWatchMarketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-MarketplaceDb}

    ports:
      - "5432:5432"

    volumes:
      - MyWatchMarketplace-postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - MyWatchMarketplace-network

volumes:
  MyWatchMarketplace-postgres-data:

networks:
  MyWatchMarketplace-network:
    driver: bridge