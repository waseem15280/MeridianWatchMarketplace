services:
  # =========================================================================
  # 1. Database: PostgreSQL 17 Multi-Database Service
  # =========================================================================
  postgres:
    image: postgres:17
    container_name: MyWatchMarketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-MarketplaceDb}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    volumes:
      - MyWatchMarketplace-postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MarketplaceDb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 2. Marketplace API Microservice (:5101)
  # =========================================================================
  marketplace-api:
    build:
      context: ./backend
      dockerfile: services/marketplace/Dockerfile
    container_name: thc-marketplace-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__MarketplaceDbConnection=${CONNECTION_STRINGS_MARKETPLACE:-Host=postgres;Port=5432;Database=MarketplaceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - Cloudinary__Url=${CLOUDINARY_URL}
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 3. Collector Vault API Microservice (:5102)
  # =========================================================================
  collector-vault-api:
    build:
      context: ./backend
      dockerfile: services/CollectorVault/Dockerfile
    container_name: thc-collector-vault-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__CollectorVaultDbConnection=${CONNECTION_STRINGS_COLLECTOR_VAULT:-Host=postgres;Port=5432;Database=CollectorVaultDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      - Services__MarketplaceUrl=http://marketplace-api:8080
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 4. Buyer Wishlist API Microservice (:5103)
  # =========================================================================
  buyer-wishlist-api:
    build:
      context: ./backend
      dockerfile: services/BuyerWishlist/Dockerfile
    container_name: thc-buyer-wishlist-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__BuyerWishlistDbConnection=${CONNECTION_STRINGS_BUYER_WISHLIST:-Host=postgres;Port=5432;Database=BuyerWishlistDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      - Services__MarketplaceUrl=http://marketplace-api:8080
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 5. Seller Hub API Microservice (:5104)
  # =========================================================================
  seller-hub-api:
    build:
      context: ./backend
      dockerfile: services/SellerHub/Dockerfile
    container_name: thc-seller-hub-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__SellerHubDbConnection=${CONNECTION_STRINGS_SELLER_HUB:-Host=postgres;Port=5432;Database=SellerHubDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
    ports:
      - "5104:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 6. Customer Orders API Microservice (:5105)
  # =========================================================================
  customer-orders-api:
    build:
      context: ./backend
      dockerfile: services/CustomerOrders/Dockerfile
    container_name: thc-customer-orders-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__CustomerOrdersDbConnection=${CONNECTION_STRINGS_CUSTOMER_ORDERS:-Host=postgres;Port=5432;Database=CustomerOrdersDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      - Services__MarketplaceUrl=http://marketplace-api:8080
      - Services__SellerHubUrl=http://seller-hub-api:8080
    ports:
      - "5105:8080"
    depends_on:
      postgres:
        condition: service_healthy
      marketplace-api:
        condition: service_started
      seller-hub-api:
        condition: service_started
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 7. User Management API Microservice (:5106)
  # =========================================================================
  user-management-api:
    build:
      context: ./backend
      dockerfile: services/UserManagement/Dockerfile
    container_name: thc-user-management-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__UserAccountDbConnection=${CONNECTION_STRINGS_USER_ACCOUNT:-Host=postgres;Port=5432;Database=UserAccountDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
    ports:
      - "5106:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 8. Email Service Microservice (:5107)
  # =========================================================================
  email-service-api:
    build:
      context: ./backend
      dockerfile: services/EmailService/Dockerfile
    container_name: thc-email-service-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__UserAccountDbConnection=${CONNECTION_STRINGS_USER_ACCOUNT:-Host=postgres;Port=5432;Database=UserAccountDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
      - EmailSettings__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
      - EmailSettings__UseMockInDevelopment=${EMAIL_USE_MOCK:-true}
      - EmailSettings__SmtpHost=${SMTP_HOST:-smtp.gmail.com}
      - EmailSettings__SmtpPort=${SMTP_PORT:-587}
      - EmailSettings__SenderName=${SMTP_SENDER_NAME:-THC Watch Marketplace}
      - EmailSettings__SenderEmail=${SMTP_SENDER_EMAIL:-no-reply@thcwatches.com}
      - EmailSettings__Username=${SMTP_USERNAME:-}
      - EmailSettings__Password=${SMTP_PASSWORD:-}
      - EmailSettings__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - EmailSettings__TokenExpirationMinutes=${TOKEN_EXPIRATION_MINUTES:-60}
    ports:
      - "5107:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 9. Service Center API Microservice (:5108)
  # =========================================================================
  service-center-api:
    build:
      context: ./backend
      dockerfile: services/ServiceCenter/Dockerfile
    container_name: thc-service-center-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__ServiceCenterDbConnection=${CONNECTION_STRINGS_SERVICE_CENTER:-Host=postgres;Port=5432;Database=ServiceCenterDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}
    ports:
      - "5108:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 10. YARP API Gateway (:5000)
  # =========================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: gateway/MyWatchMarketplace.ApiGateway/Dockerfile
    container_name: thc-api-gateway
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__marketplace-cluster__Destinations__marketplace-destination__Address=http://marketplace-api:8080
      - ReverseProxy__Clusters__collector-vault-cluster__Destinations__collector-vault-destination__Address=http://collector-vault-api:8080
      - ReverseProxy__Clusters__buyer-wishlist-cluster__Destinations__buyer-wishlist-destination__Address=http://buyer-wishlist-api:8080
      - ReverseProxy__Clusters__seller-hub-cluster__Destinations__seller-hub-destination__Address=http://seller-hub-api:8080
      - ReverseProxy__Clusters__customer-orders-cluster__Destinations__customer-orders-destination__Address=http://customer-orders-api:8080
      - ReverseProxy__Clusters__user-management-cluster__Destinations__user-management-destination__Address=http://user-management-api:8080
      - ReverseProxy__Clusters__email-service-cluster__Destinations__email-service-destination__Address=http://email-service-api:8080
      - ReverseProxy__Clusters__service-center-cluster__Destinations__service-center-destination__Address=http://service-center-api:8080
    ports:
      - "5000:8080"
    depends_on:
      marketplace-api:
        condition: service_started
      collector-vault-api:
        condition: service_started
      buyer-wishlist-api:
        condition: service_started
      seller-hub-api:
        condition: service_started
      customer-orders-api:
        condition: service_started
      user-management-api:
        condition: service_started
      email-service-api:
        condition: service_started
      service-center-api:
        condition: service_started
    networks:
      - thc-marketplace-network

  # =========================================================================
  # 11. Frontend: React Vite SPA (:3000)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:5000}
    container_name: thc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - thc-marketplace-network

volumes:
  MyWatchMarketplace-postgres-data:

networks:
  thc-marketplace-network:
    driver: bridge
